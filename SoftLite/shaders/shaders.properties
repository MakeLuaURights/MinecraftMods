# SoftLite - lightweight shaders for low-end GPUs
screen = <profile> [LIGHT] [MOTION] [FINAL]
screen.LIGHT = SHADOWS WARM_LIGHT
screen.MOTION = SWAY SWAY_STRENGTH WATER_WAVES WAVE_STRENGTH
screen.FINAL = VIGNETTE SATURATION
sliders = SWAY_STRENGTH WAVE_STRENGTH SATURATION WARM_LIGHT
profile.Performance = !SHADOWS SWAY !WATER_WAVES !VIGNETTE
profile.Balanced = SHADOWS SWAY WATER_WAVES VIGNETTE
oldLighting = false
clouds = fast
